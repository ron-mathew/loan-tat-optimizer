services:
  - type: web
    name: loan-tat-optimizer
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: oregon
    plan: free
    healthCheckPath: /health
    # Give models time to load in background before health checks start
    initialDeployHook: "sleep 5"
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PORT
        value: "8000"
